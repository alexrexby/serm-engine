name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tests do not launch a browser: Playwright's Chromium is not installed here
      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q
