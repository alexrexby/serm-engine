name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Chromium for the tests that render in a browser (lead magnet PDF, admin XSS)
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q
