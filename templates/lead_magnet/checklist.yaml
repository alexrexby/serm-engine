# Нейтральный лид-магнит «чек-лист самопроверки» (template-режим; в llm-режиме содержание пишет модель).
# YAML; строковые значения — шаблоны Jinja, рендер после разбора. Контекст: profile, magnet (запись lead_magnets), topic.
# keywords — подстроки темы, по которым detect_preset_key выбирает этот пресет.
keywords: []
title: "{{ magnet.title }}"
subtitle: "{{ magnet.desc }}"
badge: "Чек-лист"
manifest: "Короткая самопроверка. Пройдите по пунктам и отметьте те, что у вас сейчас не закрыты: с них и стоит начать."
blocks:
- title: "1. У каждого процесса есть ответственный"
  risk: "Задачи теряются между людьми"
  severity: "danger"
  desc: "Работа идёт, пока о ней кто-то помнит. Человек ушёл в отпуск или уволился — и всё встало."
  solution: "Назначьте ответственного и запишите, что он проверяет и как часто."
- title: "2. Главные цифры видны без ручного сбора"
  risk: "Решения принимаются наугад"
  severity: "warning"
  desc: "Чтобы понять, как идут дела, приходится вручную сводить данные из нескольких мест."
  solution: "Выберите 3–5 показателей и сведите их в один отчёт, который обновляется сам."
- title: "3. Рутина не съедает рабочую неделю"
  risk: "Время уходит на рутину"
  severity: "warning"
  desc: "Одни и те же действия каждую неделю делаются вручную — и каждый раз с риском ошибки."
  solution: "Выпишите такие действия и начните с самого частого: его проще всего упростить или автоматизировать."
