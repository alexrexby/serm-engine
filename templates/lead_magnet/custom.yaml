# Лид-магнит на произвольную тему (не пресет): тема из админки или инфоповода радара.
# YAML; строковые значения — шаблоны Jinja, рендер после разбора. Контекст: profile, topic.
title: "Самопроверка: {{ topic }}"
subtitle: "Короткий чек-лист: где теряются время и деньги"
badge: "Чек-лист"
manifest: "Три пункта по теме «{{ topic }}». Отметьте те, что у вас сейчас не так: с них и стоит начать."
blocks:
- title: "1. Узкие места видны заранее"
  risk: "Потери, которых не видно"
  severity: "danger"
  desc: "По направлению «{{ topic }}» нет контрольных точек: о проблеме узнают, когда она уже стоила денег."
  solution: "Выберите 2–3 показателя и договоритесь, кто и как часто их проверяет."
- title: "2. Данные не переносятся вручную"
  risk: "Ошибки и задержки"
  severity: "warning"
  desc: "Информацию из одной системы или таблицы в другую переносят руками."
  solution: "Свяжите системы напрямую или автоматизируйте перенос — начните с самого частого."
- title: "3. Отклонения замечают сразу"
  risk: "Непредвиденные расходы"
  severity: "warning"
  desc: "Документы, оплаты и договорённости сверяют от случая к случаю."
  solution: "Заведите регулярную сверку и уведомление, если что-то пошло не по плану."
