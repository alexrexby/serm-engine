# Тексты аналитики бота (админка: вкладка аналитики). YAML; строковые значения — шаблоны Jinja,
# рендер ПОСЛЕ разбора (slug из /start вводит любой пользователь Telegram — YAML он сломать не может).
# Контекст всех строк: profile; дополнительно — указанный в комментарии.
# Пороги 50 и 100 переходов зашиты в core/db.py (get_content_strategy_recommendations) — меняете там, меняйте и здесь.
topic_general: "Без темы (прямой вход в бота)"
topic_fallback: "Метка: {{ slug }}"   # slug
launch:   # 0 переходов
  - type: "launch"
    priority: "high"
    title: "Наберите первые 50–100 переходов"
    text: "Переходов в бота пока нет, выводы делать не из чего. Публикуйте статьи и посты со ссылками на бота, а решения о темах принимайте после 50–100 переходов, а не по календарю."
  - type: "content_plan"
    priority: "medium"
    title: "Начните с самой близкой темы"
    text: "Первой выпускайте тему, которая ближе всего к проблеме ваших клиентов. Потом сравните темы по тому, сколько людей подписалось на канал."
  - type: "magnet"
    priority: "medium"
    title: "У каждой публикации — своя ссылка"
    text: "Ставьте в публикацию ссылку на бота с меткой её темы (например, ?start={{ profile.lead_magnets[0].slug if profile.lead_magnets else 'audit' }}). Читатель получит тот материал, ради которого перешёл, а вы увидите, какая тема работает."
sample_accumulation:   # starts
  title: "Переходов: {{ starts }} из 50 — выводы делать рано"
  text: "Нужно минимум 50 переходов, лучше 100. Пока разница между темами может быть случайной: публикуйте по плану и не меняйте его резко."
sample_emerging:   # starts
  title: "Переходов: {{ starts }} из 100 — появились лидеры"
  text: "Минимум в 50 переходов пройден, первые темы-лидеры уже видны. До 100 переходов лидер ещё может смениться, поэтому меняйте план постепенно."
sample_complete:   # starts
  title: "Переходов: {{ starts }} — можно делать выводы"
  text: "100 переходов набрано: на таком объёме разницу между темами уже можно учитывать. Пишите больше на тему-лидера, слабые темы переформулируйте или уберите."
scaling:   # starts, best (topic_name, cr_sub, starts, subs)
  title: "Больше всего подписок: «{{ best.topic_name }}» ({{ best.cr_sub }}%)"
  text: "Переходов: {{ best.starts }}, подписок: {{ best.subs }}. {% if starts >= 50 %}Сделайте эту тему основной в контент-плане.{% else %}Пока не меняйте план: дождитесь 50 переходов.{% endif %}"
monetization:   # best (topic_name, cr_lead)
  title: "Больше всего заявок: «{{ best.topic_name }}» ({{ best.cr_lead }}%)"
  text: "С этой темы чаще всего приходят заявки на платные форматы ({{ best.cr_lead }}% переходов). Пишите на неё регулярно и заканчивайте материалы предложением о работе."
optimization:   # low (topic_name, cr_sub, starts)
  title: "«{{ low.topic_name }}»: мало подписок"
  text: "Подписались {{ low.cr_sub }}% из {{ low.starts }} перешедших. Сделайте сильнее первый абзац публикации и яснее объясните, что человек получит после подписки."
